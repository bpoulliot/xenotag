name: Notifications

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
    tags: ["v*"]
  registry_package:
    types: [published, updated]
  release:
    types: [published]

jobs:
  notify:
    name: Send ntfy notification
    runs-on: ubuntu-latest
    # Skip bot-generated events (dependabot PRs, auto-commits, etc.)
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'

    steps:
      - name: Build and send notification
        continue-on-error: true
        env:
          NTFY_URL: https://ntfy.bitmapserv.org/ci
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          case "${EVENT}:${ACTION}" in

            issues:opened)
              TITLE="New issue — ${REPO}"
              MSG="#${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
              URL="${{ github.event.issue.html_url }}"
              TAGS="memo"
              PRIORITY="default"
              ;;

            issues:closed)
              TITLE="Issue closed — ${REPO}"
              MSG="#${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
              URL="${{ github.event.issue.html_url }}"
              TAGS="white_check_mark"
              PRIORITY="low"
              ;;

            issues:reopened)
              TITLE="Issue reopened — ${REPO}"
              MSG="#${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
              URL="${{ github.event.issue.html_url }}"
              TAGS="warning"
              PRIORITY="default"
              ;;

            issue_comment:created)
              TITLE="New comment — ${REPO}"
              MSG="${ACTOR} commented on #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
              URL="${{ github.event.comment.html_url }}"
              TAGS="speech_balloon"
              PRIORITY="low"
              ;;

            pull_request:opened)
              TITLE="New PR — ${REPO}"
              MSG="#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              URL="${{ github.event.pull_request.html_url }}"
              TAGS="arrow_heading_up"
              PRIORITY="default"
              ;;

            pull_request:closed)
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                TITLE="PR merged — ${REPO}"
                TAGS="merged,tada"
                PRIORITY="default"
              else
                TITLE="PR closed — ${REPO}"
                TAGS="no_entry_sign"
                PRIORITY="low"
              fi
              MSG="#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              URL="${{ github.event.pull_request.html_url }}"
              ;;

            pull_request:ready_for_review)
              TITLE="PR ready for review — ${REPO}"
              MSG="#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              URL="${{ github.event.pull_request.html_url }}"
              TAGS="eyes"
              PRIORITY="default"
              ;;

            pull_request_review:submitted)
              STATE="${{ github.event.review.state }}"
              case "$STATE" in
                approved)       TAGS="heavy_check_mark"; PRIORITY="default" ;;
                changes_requested) TAGS="pencil2"; PRIORITY="high" ;;
                commented)      TAGS="speech_balloon"; PRIORITY="low" ;;
                *)              TAGS="speech_balloon"; PRIORITY="low" ;;
              esac
              TITLE="Review ${STATE} — ${REPO}"
              MSG="#${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
              URL="${{ github.event.review.html_url }}"
              ;;

            push:*)
              # Only notify on pushes to main (not every branch push)
              if [ "${{ github.ref }}" != "refs/heads/main" ] && \
                 [[ "${{ github.ref }}" != refs/tags/* ]]; then
                echo "Skipping push notification for non-main ref: ${{ github.ref }}"
                exit 0
              fi
              if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                TAG="${{ github.ref_name }}"
                TITLE="Tag pushed: ${TAG} — ${REPO}"
                MSG="Tagged by ${ACTOR}"
                URL="https://github.com/${REPO}/releases/tag/${TAG}"
                TAGS="label"
                PRIORITY="default"
              else
                COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
                TITLE="Pushed to main — ${REPO}"
                MSG="${ACTOR}: ${COMMIT_MSG}"
                URL="${{ github.event.head_commit.url }}"
                TAGS="arrow_up"
                PRIORITY="low"
              fi
              ;;

            registry_package:published)
              PKG="${{ github.event.registry_package.name }}"
              VER="${{ github.event.registry_package.package_version.version }}"
              TITLE="Docker image published — ${REPO}"
              MSG="${PKG}:${VER}"
              URL="https://github.com/${REPO}/pkgs/container/${PKG}"
              TAGS="whale,package"
              PRIORITY="default"
              ;;

            registry_package:updated)
              PKG="${{ github.event.registry_package.name }}"
              TITLE="Docker image updated — ${REPO}"
              MSG="${PKG}"
              URL="https://github.com/${REPO}/pkgs/container/${PKG}"
              TAGS="whale"
              PRIORITY="low"
              ;;

            release:published)
              TITLE="Release published — ${REPO}"
              MSG="${{ github.event.release.name || github.event.release.tag_name }}"
              URL="${{ github.event.release.html_url }}"
              TAGS="rocket"
              PRIORITY="default"
              ;;

            *)
              echo "Unhandled event ${EVENT}:${ACTION} — skipping"
              exit 0
              ;;
          esac

          curl -s -X POST "${NTFY_URL}" \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: ${TITLE}" \
            -H "Tags: ${TAGS}" \
            -H "Priority: ${PRIORITY}" \
            -H "Click: ${URL}" \
            -d "${MSG} (${ACTOR})"
