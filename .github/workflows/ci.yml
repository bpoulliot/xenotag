name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint/security tools
        run: pip install ruff black bandit[toml] pip-audit

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Format check (black)
        run: black --check app/

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Security scan — Python code (bandit)
        run: bandit -r app/ -ll --exclude app/static

      - name: Security scan — dependencies (pip-audit)
        run: pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt pytest

      - name: Tests (pytest)
        run: pytest tests/ -q

      - name: Badge contrast probe self-test
        run: python scripts/measure_badge_contrast.py --self-test

      - name: Legacy tag audit probe self-test
        run: python scripts/audit_legacy_tags.py --self-test

      # Two steps: --self-test proves the probe can still see a planted
      # collision, and the bare run is the B3 acceptance criterion itself --
      # it exits non-zero if any poster width is served another width's tile.
      - name: Pill cache key probe self-test
        run: python scripts/measure_pill_cache_key.py --self-test

      - name: Pill cache key sweep (B3 — must find zero collisions)
        run: python scripts/measure_pill_cache_key.py

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: xenotag:ci
          build-args: BUILD_VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: xenotag:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
