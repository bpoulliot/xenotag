# Secrets can be supplied by the environment instead of this file — see
# "Externally managed secrets" in the README. A field the environment supplies
# is never written back here, so a Settings save cannot clobber it.
jellyfin:
  url: http://jellyfin:8096
  api_key: ""  # or set JELLYFIN_API_KEY / JELLYFIN_API_KEY_FILE
  library_ids: []  # empty = all libraries

# Sonarr integration is optional. Remove or leave empty to use Jellyfin only.
# sonarr:
#   instances:
#     - name: general
#       url: http://sonarr:8989
#       api_key: ""  # or api_key_file: /run/secrets/sonarr (never written back here)

# Radarr integration is optional. Remove or leave empty to use Jellyfin only.
# radarr:
#   instances:
#     - name: general
#       url: http://radarr:7878
#       api_key: ""  # or api_key_file: /run/secrets/radarr (never written back here)

# Sonarr/Radarr writes ship as a dry run: every scan matches each item to its
# series/movie and records what WOULD be written (Settings shows the report),
# and nothing but GETs is sent. Turning either switch on forces a full re-tag.
arr_sync:
  mode: dry_run                  # dry_run | live
  certification_fallback: false  # fill a blank Jellyfin rating from the *arr certification

# Items Jellyfin no longer has: every scan works out which index rows, and which
# managed tags on their Sonarr/Radarr series/movie, are stale. "report" changes
# nothing -- read Settings -> Deleted items before switching to "remove".
deleted_items:
  mode: report                   # report | remove
  max_fraction: 0.15             # removal refuses when more of the index than this would go

scan:
  schedule: "0 3 * * *"  # cron expression; empty = manual-only
  incremental: true
  path_filters: []        # path prefixes to restrict scanning (e.g. /media/movies); empty = all
  max_workers: 4          # parallel ffprobe workers; lower for slow/spinning disks
  # Jellyfin tag reconciliation (B12(b)): puts back xt- tags Jellyfin lost. Empty = off.
  reconcile_schedule: "0 5 * * *"
  reconcile_write_threshold: 500  # a scheduled pass with MORE items to fix writes none and alerts

tags:
  managed_prefix: "xt-"
  legacy_prefixes: ["mf-"]      # stripped on sight, from the server and the local index
  dual_audio_tag: "dual-audio"  # applied when exactly 2 audio languages found
  multi_audio_tag: "re-encode"  # applied when 3+ audio languages found
  destinations:
    video:     [poster, jellyfin, sonarr, radarr]
    audio:     [poster, jellyfin, sonarr, radarr]
    subtitles: [poster, jellyfin]
    rating:    [poster]

image:
  targets:
    - poster.jpg
    - poster.png
    - folder.jpg
    - folder.png
  backup_suffix: ".orig"
  badge_position: bottom-left  # bottom-left | bottom-right | top-left | top-right
  rating_position: top-left   # content-rating corner; sharing badge_position's corner stacks them
  badge_opacity: 1.0         # contrast control: <1.0 lets the poster through the fill
  badge_size: tv               # desktop | tv | tv_plus (see README for guidance)
  badge_text_color: "#ffffff"
  # Categories differ in lightness as well as hue so they stay distinct for
  # colour-blind viewers. Check a palette of your own with
  # scripts/measure_palette_separation.py --config FILE
  video_badge_color:  "#203a30"
  audio_badge_color:  "#312c4c"
  sub_badge_color:    "#50532f"
  rating_badge_color: "#73485b"
  badge_palette_version: 2   # leave as-is; marks the default-palette migration done
  show_video_badges:  true
  show_audio_badges:  true
  show_sub_badges:    true
  show_rating_badge:  true
  normalize_portrait: true     # pad non-portrait images to 2:3 before overlaying
  prefer_languages: []         # e.g. [EN, JA, DE]: these audio/subtitle pills first; reorders, never hides

auth:
  username: admin
  password_hash: ""  # auto-generated on first run (password in /config/initial-password); or seed via XENOTAG_USERNAME/XENOTAG_PASSWORD
  # secret_key: ""   # auto-generated on first run; or set XENOTAG_SECRET_KEY / XENOTAG_SECRET_KEY_FILE

log_level: INFO
