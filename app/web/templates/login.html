<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xenotag — Sign in</title>
<link rel="icon" href="/static/favicon.ico?v={{ v }}" sizes="any">
<link rel="icon" href="/static/favicon.png?v={{ v }}" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ v }}">
<link rel="manifest" href="/static/site.webmanifest?v={{ v }}">
<meta name="theme-color" content="#171b19">
<link rel="stylesheet" href="/static/theme.css?v={{ v }}">
<style>
  /* Colour tokens live in /static/theme.css, shared with index.html -- this
     page used to carry its own copy, which had drifted. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px 40px; width: 340px; }
  /* The wordmark carries the mark as its O, so it stands alone here -- the old
     mark-plus-heading pairing printed the glyph twice. */
  .logo-row { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 24px; }
  .logo-row .brand-logo { display: block; width: 100%; max-width: 236px; height: auto; }
  .logo-row small { color: var(--muted); font-size: 10.5px; letter-spacing: .3px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; margin-top: 14px; text-transform: uppercase; letter-spacing: .4px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--inset); color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { display: block; width: 100%; margin-top: 20px; padding: 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
  .error { background: var(--danger-bg); border: 1px solid var(--red); border-radius: 6px; color: var(--red); font-size: 13px; padding: 8px 12px; margin-bottom: 8px; }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <img class="brand-logo" src="/static/logo-wordmark.png?v={{ v }}" alt=""
         onerror="this.style.display='none'">
    <h1 class="sr-only">Xenotag</h1>
    <small>Media information. Beyond the basics.</small>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <p class="hint">Check container logs for first-run credentials.</p>
</div>
</body>
</html>
